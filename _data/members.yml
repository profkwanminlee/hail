- name: Heyongsun Im
  title: Doctoral Student · Researcher
  role_tag: PhD Student
  image: /images/people/74bce6ce9e7d195fda969f3f80ca5667ad9e6d0a-1201x1501.jpg
  focus: HCI & Social Simulation with Agentic AI
  bio: Hyeongsun is a PhD student at WKWSCI, Nanyang Technological University. His research focuses on Human-Computer Interaction, Human-AI Collaboration, and multi-agent social simulations. He develops synthetic panels and artificial societies simulating diverse human populations to explore complex behavioral dynamics.
