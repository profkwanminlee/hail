- name: Keqi Chen
  title: Doctoral Student · Automotive HCI
  role_tag: PhD Student
  image: /images/people/37fe9a285b2a3b28b0ddacced1543efdbecd0abb-1280x1600.jpg
  focus: Autonomous Vehicles & Smart Cockpit UX
  bio: Keqi Chen is a PhD student at the School of Mechanical and Aerospace Engineering (MAE) at NTU. Holding a Master's degree in Design Informatics from the University of Edinburgh, his research investigates interaction design in smart vehicular cockpits and multimodal communication between drivers and autonomous vehicle agents.
