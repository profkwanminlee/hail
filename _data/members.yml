- name: Li Xie (Sherry)
  title: Doctoral Student · Researcher
  role_tag: PhD Student
  image: /images/people/8d1c034f6d1730ee67dd714458a0367327b499c4-1279x1599.jpg
  focus: AI in Journalism & Media Psychology
  bio: Li Xie (Sherry) is a PhD student at Wee Kim Wee School of Communication and Information, Nanyang Technological University. Her research investigates how AI-enabled systems (particularly conversational agents) transform journalistic practice and shape psychological perceptions among audience demographics. Prior to NTU, Li earned her Master's at HKPU and worked as a professional news editor.
