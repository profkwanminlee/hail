- name: Shreya Gopi
  title: Doctoral Candidate · Lead Researcher
  role_tag: PhD Candidate
  image: /images/people/e77fa0666954495fdb0b5ed902d72c76f77b5695-976x1219.jpg
  focus: Explainable AI (XAI) & Psychological Trust
  bio: Shreya is a PhD candidate at the Wee Kim Wee School of Communication and Information. Her research centers on human-AI interaction and the psychological effects of information communication technologies. Currently, she is examining the cognitive and affective effects of interacting with AI systems that explain decision rationale (Explainable AI), focusing on trust calibration and algorithmic appreciation.
