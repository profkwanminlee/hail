- name: Kwan M. Lee, Ph.D.
  title: Korea Foundation Endowed Chair Professor · Lab Director
  role_tag: Lab Director & Founder
  image: /images/people/d08104b3371505e67fc8201bc5197796fc4d44ab-432x578.jpg
  focus: Human-AI Interaction, User Experience (UX), Presence & Social Robotics
  bio: Professor Kwan M. Lee is a leading global authority in UX research, Human-Computer Interaction (HCI), and digital culture. Mentored by Clifford Nass at Stanford University, he previously served as Vice President at Samsung Electronics leading the UX Group and founding C-Lab. He has spearheaded $12M+ in competitive research grants, published 130+ peer-reviewed treatises, holds 10 US patents, and is an elected Fellow of the International Communication Association (ICA).
