- name: Yanqin Wu (Yasmin)
  title: Doctoral Student · Researcher
  role_tag: PhD Student
  image: /images/people/e79398e5212b89e239c88f2d024f8d5cd81084e8-2396x2995.jpg
  focus: Mental Health Communication & AI Addiction
  bio: Yanqin (Yasmin) is a PhD student at WKWSCI, Nanyang Technological University. Her research spans human-AI interaction, health communication (focusing on mental health and digital stress management), and media effects. Her empirical studies investigate how digital agents and personalized conversational AI modulate psychological well-being and behavioral outcomes.
