- id: "ai-agent-design"
  title: "AI Agent Design & User Experience"
  icon: "fa-solid fa-robot"
  summary: "Investigating how AI system design shapes user experiences across diverse applications — from virtual influencers and robo-advisors to conversational assistants and autonomous vehicle interfaces."
  details: "We examine personality traits, communication styles, interface embodiment, and interaction modalities across diverse applications. Our research addresses both the opportunities and challenges of human-AI relationships, developing evidence-based design principles for trustworthy and engaging AI systems."

- id: "ai-enhanced-methods"
  title: "AI-Enhanced Research Methods"
  icon: "fa-solid fa-network-wired"
  summary: "Developing innovative methodologies that leverage AI as a research collaborator, including synthetic panels and artificial societies simulating diverse human populations to pre-test hypotheses and validate findings at scale."
  details: "Creating synthetic research panels or artificial societies that can simulate diverse human populations and perspectives, enabling researchers to pre-test hypotheses, explore complex social dynamics, and validate findings at scale with real-life interventions while maintaining scientific rigor."

- id: "explainable-ai"
  title: "Explainable AI & User Understanding"
  icon: "fa-solid fa-lightbulb"
  summary: "Developing frameworks for transparent AI systems that users can understand and effectively collaborate with, particularly in high-stakes decision-making contexts where trust and comprehension are critical."
  details: "Investigating how explanation modalities (contrastive, counterfactual, interactive) affect cognitive load, psychological trust calibration, and algorithmic appreciation in high-stakes environments such as healthcare, education, and finance."

- id: "immersive-ai"
  title: "Immersive AI Experiences"
  icon: "fa-solid fa-vr-cardboard"
  summary: "Exploring social presence and psychological responses in VR/AR environments and metaverse platforms where users interact with AI-driven agents — both virtual avatars and physical embodied robots."
  details: "Investigating presence heuristics, avatar embodiment, the Proteus effect, and multisensory cues in virtual and augmented reality to understand how immersive media shapes human perception, behavioral adherence, and emotional connection with AI."

- id: "ai-ethics-policy"
  title: "AI Ethics, Philosophy & Policy"
  icon: "fa-solid fa-scale-balanced"
  summary: "Examining the ethical implications of human-AI interaction — including agency, responsibility, and digital personhood — developing guidelines for responsible AI design and contributing to global policy discussions."
  details: "Exploring philosophical frameworks for understanding AI consciousness and digital personhood claims, developing guidelines for responsible AI design, and advising policymakers on evidence-based AI governance, bias mitigation, and human dignity."
