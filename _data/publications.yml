- title: 'Bringing people into the story: How virtual reality journalism affects the feeling of presence'
  meta: Lee, S., Kim, T., Lee, K. M., Park, N., & Song, H. (2025). Digital Journalism.
  year: '2025'
  abstract: 'Virtual reality (VR) journalism can offer immersive experiences, enhancing the audience''s empathy and issue involvement. In the literature, however, the term VR refers to different types of technology, which may obscure the clear effects of VR journalism. Guided by the framework for immersive virtual environment (FIVE), this paper investigated the effects of VR journalism focusing on two different features of VR: device-focused (i.e., head-mounted display (HMD)) and content format-focused (i.e., 360° video) by conducting a 3 (device-focused: HMD, computer, smartphone) X 2 (content-focused: 360° video, fixed view video) between-subjects experiment (N = 171). Results showed that participants in the 360° video condition, compared to those in the fixed video condition, experienced a higher level of social presence, which, in turn, increased their empathic concern toward the characters and led them to be more involved in the videos'' topic. The HMD condition, on the other hand,
    did not show significant differences in helping participants engage in the characters and the topic, compared to computer and smartphone conditions. Theoretical and practical implications of the different features of VR are discussed.'
  url: https://doi.org/10.1080/21670811.2025.2553157
  themes:
  - Technologies for Advertising, PR & Journalism
- title: Exploring the association between the Proteus effect and intention to play massive multiplayer online role-playing games (MMORPGs)
  meta: Sun, S., Kim, J. H., Lee, K. M., & Nan, D. (2024). Internet Research, 34(1), 58-78.
  year: '2024'
  abstract: 'Purpose: Massive multiplayer online role-playing games (MMORPGs) are representative metaverse games that are thriving in academia and the industry. This study aims to develop an integrated model based on Yee''s motivations and the Proteus effect to explore individuals'' intentions of playing MMORPGs.Methodology: The data were gathered by conducting an online survey (n = 441) for the players of World of Warcraft, an MMORPG. The collected data were analyzed with a structural equation model.Findings: The outcomes of this research reveal that the Proteus effect positively influenced the intentions of the players to play the game via mediations of social, immersion, achievement motivations and enjoyment. Furthermore, the players influenced by the Proteus effect, which enables avatar embodiment and identification, exhibited a stronger intention to play MMORPGs.Originality: This research is one of the first attempts to establish a theoretical framework involving the Proteus effect
    and Yee''s motivations. In addition, the findings of this study imply that the Proteus effect should be considered when investigating the individual experience of metaverse games.'
  url: https://doi.org/10.1108/INTR-07-2022-0487
  themes:
  - Computer Games and Entertainment Technologies
- title: 'Replicable Innovation: Bridging Theory and Real-World Applications'
  meta: Lee, K. M., Wu, D-Y., Hsu, C-Y., & Cheng, P-W. (2024). Information Society Studies, 47, pp. 1-15.
  year: '2024'
  abstract: In this dialogue, Dr. Kwan Min Lee, with his extensive experience in both academic research and the leadership of communication technology product design, underscores the vital link between academic theory and practical application. He stresses the importance of a deep understanding of inherent human tendencies and technological form factors to drive forward both research and practical advancements in communication technology. Additionally, Dr. Lee shares insights from his journey in developing theories related to presence and human-computer interaction, grounded in his understanding of human psychology. He also offers observations and insights on the evolving challenges in the field of communication technology, highlighting areas that require further exploration and study.
  url: https://doi.org/10.29843/JCCIS.202407_(47).0001
  themes:
  - HCI Theories, Concepts and Philosophy
- title: Voice orientation of conversational interfaces in vehicles
  meta: Lee, K. M., Moon, Y., Park, I., & Lee, J. (2023). Behaviour & Information Technology.
  year: '2023'
  abstract: 'Connected vehicles have become a promising platform for conversational agents. However, drivers might struggle to control systems that feature multiple AI agents. To improve the usability of increasingly complex systems and the user''s interaction experience, the integration of various conversational agents needs to be carefully considered. This study aims to investigate the following: What constitutes an efficient, user-friendly arrangement of the tasks performed by a home and a car artificial intelligence (AI) agent? What is the optimal method to trigger the use of such agents? A between-subjects factorial experiment was conducted with three types of AI agent setting (home AI generalist vs. vehicle AI generalist vs. home and vehicle AI specialists) and two activation methods (voice activation vs. push-to-talk activation). The results indicate that interacting with specialist AI agents enhances the perceived ease of use and the credibility of these agents. Furthermore, voice
    activation improves the social presence and attractiveness of an AI agent. The findings suggest that an AI agent that offers role specialization and a natural interaction method will improve drivers'' interaction experience.'
  url: https://doi.org/10.1080/0144929X.2023.2166870
  themes:
  - Speech User Interface
- title: A bibliometric analysis of Metaverse research using VOSviewer
  meta: Nan, D., Sun, S., Gopi, S., Lee, K. M., & Kim, J. H. (2023). Proceedings of 17th International Conference on Ubiquitous Information Management and Communication (IMCOM), 1-4.
  year: '2023'
  abstract: This research tracked the knowledge frameworks of the Metaverse academic field. To this end, we employed "metaverse" as the keyword to gather articles from Web of Science and performed bibliometric analyses using VOSviewer. Concretely, we explored productive and highly-cited authors, institutes, countries/regions, and journals/conference proceedings. For a deeper understanding of the state of Metaverse research, we also reviewed highly-cited literature and performed keyword-occurrence analysis. Overall, this is one of the first studies providing a comprehensive understanding of knowledge structures in the context of Metaverse research.
  url: https://doi.org/10.1109/IMCOM56909.2023.10035584
  themes:
  - Computer Games and Entertainment Technologies
- title: 'Fintech agents: Technologies and theories'
  meta: Pal, A., Gopi, S., & Lee, K. M. (2023). Electronics, 12(15), 3301.
  year: '2023'
  abstract: 'Many financial technology (fintech) applications have incorporated interactive computer agents to act as mediators between the user and the fintech system. This paper provides a comprehensive review of interactive fintech agents from technological and social science perspectives. First, we explain the general fintech landscape and define interactive fintech agents. Next, we review the major technologies involved in creating fintech: (1) artificial intelligence and machine learning, (2) big data, (3) cloud computing, and (4) blockchain; as well as the specific key technologies enabling the following aspects of interactive fintech agents: (1) intelligence, (2) understanding of users, and (3) manifestation as social actors. Following the technology review, we examine issues and theories related to human-fintech agent interaction in the following areas: (1) agents'' understanding of users, (2) agents'' manifestation as social actors (via embodiment, emotion, and personality), and
    (3) users'' social interaction with agents. Finally, we suggest directions for future research on fintech agents.'
  url: https://doi.org/10.3390/electronics12153301
  themes:
  - Financial Technology
- title: Financial Technologies
  meta: Pal, A., Gopi, S., & Lee, K. M. (2023). In Encyclopedia.
  year: '2023'
  abstract: Financial technology (fintech) is an emerging field where novel technologies are used to improve the business operations or services offered by financial institutions and enterprises. Artificial intelligence (AI), blockchain, and cloud services have caused process disruption, while big data enables greater customer acquisition and retention. Together, these technologies have enhanced the use of interactive fintech agents in finance.
  url: https://encyclopedia.pub/entry/51483
  themes:
  - Financial Technology
- title: Interacting with an embodied interface effects of embodied agent and voice command on smart TV interface
  meta: Lee, K. M., Lee, J., & Sah, Y. J. (2022). Interaction Studies, 23(1), 116-142.
  year: '2022'
  abstract: 'Despite their potential for facilitating interaction between a user and computer, an embodied agent and voice command have not been examined enough for their matching effects. The current study proposes that an embodied agent and voice command generate positive evaluative outcomes, particularly when they are accompanied by each other. To test this prediction, we conducted a 2 (visual output: embodied agent vs. geometric figure) × 2 (input modality: voice command vs. remote controller) between-subjects experiment (N = 52), and examined whether visual output and input modality jointly influence participants'' social attribution (i.e., anthropomorphism, animacy, likability, and perceived intelligence), social presence, and satisfaction. Results show that voice command does facilitate users'' social attribution and social presence, but only when an embodied agent was presented. Also, the effects of voice command on social presence and satisfaction were mediated by anthropomorphism
    and perceived intelligence respectively, but only when the interface displayed an embodied agent. The present study evidences the holistic nature of human-computer interaction, revealing the importance of matches in the input and output interface.'
  url: https://doi.org/10.1075/is.20030.lee
  themes:
  - Speech User Interface
- title: Polite speech strategies and their impact on drivers' trust in autonomous vehicles
  meta: Lee, J., & Lee, K. M. (2022). Computers in Human Behavior, 127, 107015.
  year: '2022'
  abstract: This study proposes adopting linguistic politeness in vehicle speech interfaces, as active communication between drivers and vehicles will become an essential part of driving with advanced autonomous driving technologies. Two between-subjects experiments were conducted to test the influences of politeness strategies (i.e., asking help, giving a reason, expressing gratitude) on drivers' perceptions of the vehicles. The results indicate that drivers evaluate polite vehicles as more sociable and trustworthy, and they perceive polite instructions were more acceptable. The results also suggest that providing reasons for requests and expressing gratitude for drivers' cooperation can be an optimal linguistic strategy in vehicle speech interfaces. Moreover, this study identifies the layers of heuristics in the process of shaping trust in autonomous vehicles. Drivers can instantly recognize politeness in vehicle speech interfaces, and this politeness heuristic was found to increase drivers'
    perception of social presence, thereby heightening drivers' trust in the autonomous vehicles.
  url: https://doi.org/10.1016/j.chb.2021.107015
  themes:
  - Speech User Interface
- title: 'The digital divide and seeking health information on smartphones in Asia: Survey study of ten countries'
  meta: Wang, X., Shi, J., & Lee, K. M. (2022). Journal of Medical Internet Research, 24(1), e24086.
  year: '2022'
  abstract: 'Background: Although recent developments in mobile health have elevated the importance of how smartphones empower individuals to seek health information, research investigating this phenomenon in Asian countries has been rare.Objective: The goal of our study was to provide a comprehensive profile of mobile health information seekers and to examine the individual- and country-level digital divide in Asia.Methods: With survey data from 10 Asian countries (N=9086), we ran multilevel regression models to assess the effect of sociodemographic factors, technological factors, and country-level disparities on using smartphones to seek health information.Results: Respondents who were women (β=.13, P<.001), parents (β=.16, P<.001), employed (β=.08, P=.002), of higher social status (β=.08, P<.001), and/or from countries with low health expenditures (β=.19, P=.02) were more likely to use smartphones to seek health information. In terms of technological factors, technology innovativeness
    (β=.10, P<.001) and frequency of smartphone use (β=.42, P<.001) were important factors of health information seeking, whereas the effect of online information quality was marginal (β=–.04, P<.001).Conclusions: Among smartphone users in Asia, health information seeking varies according to individuals'' socioeconomic status, their innovativeness toward technology, and their frequency of smartphone use. Although smartphones widen the digital divide among individuals with different socioeconomic status, they also bridge the divide between countries with varying health expenditures. Smartphones appear to be a particularly useful complement to manage health in developing countries.'
  url: https://doi.org/10.2196/24086
  themes:
  - Healthcare Technology
- title: 'Cultural differences in digital game experiences: Psychological responses to avatar and game environments'
  meta: Lee, K. M., & Sah, Y. J. (2022). International Journal of Gaming and Computer-Mediated Simulations (IJGCMS), 14(1), 1-15.
  year: '2022'
  abstract: 'The literature proposes that East Asians have a holistic view focusing on both salient objects and their backgrounds, whereas Westerners maintain an analytic view paying attention to focal objects and their attributes. Moreover, East Asians stress interdependency of self, while Westerners emphasize independency of self. The current study examined how cultural differences in world views and self-construals influence players'' digital game experience, including visual attention, avatar identification, sense of agency, and spatial presence. Supporting the hypotheses, results showed that South Korean participants, compared to European participants, did pay greater attention to background objects, feel greater spatial presence, and lower agency over their avatar. Participants also differed in the association between spatial presence and enjoyment: spatial presence positively predicted enjoyment for South Korean participants, but not for European participants. Theoretical and practical
    implications of the study are discussed.'
  url: https://doi.org/10.4018/IJGCMS.313186
  themes:
  - Computer Games and Entertainment Technologies
