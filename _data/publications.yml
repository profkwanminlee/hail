- title: 'Virtual reality advertising with brand experiences: The effects of media devices, virtual representation of the self, and self-presence'
  meta: Song, H., Kim, J., Nguyen, T., Lee, K. M., & Park, N. (2021). International Journal of Advertising, 40(7), 1096-1114.
  year: '2021'
  abstract: 'Virtual reality (VR) is gaining mainstream attention, but little is known about the effects of VR advertising (VR ad). This study examined 360-degree video-based advertising, which presented an entire view of the scene and allowed users to pan around the view interactively. In particular, the study sought to answer the following questions: (a) does the effect of VR ad vary when it is viewed with different media devices?; (b) what is the effect of virtual representation of the self (VRS) in VR ad?; and (c) does self-presence mediate the association between VRS and the user''s experience with an advertised brand? An experiment (N = 203) was conducted using a 2 (VRS: present vs. absent) × 3 (media devices: smartphone vs. computer vs. head-mounted display) between-subjects design. Primary findings indicate that absence of VRS in VR ad had positive effects on users'' liking the ad and favorable attitude toward the advertised brand. Self-presence was found to be a significant mediator
    that explains why absence of VRS led to favorable experiences. The study did not find any significant difference on VR ad experiences across media devices. Theoretical and practical implications of VR ad were discussed.'
  url: https://doi.org/10.1080/02650487.2020.1834210
  themes:
  - Technologies for Advertising, PR & Journalism
- title: 'The (digital) medium of mobility is the message: Examining the influence of e-scooter mobile app perceptions on e-scooter use intent'
  meta: Ratan, R., Earle, K., Rosenthal, S., Chen, V. H. H., Gambino, A., Goggin, G., Stevens, H., Li, B., & Lee, K. M. (2021). Computers in Human Behavior Reports, 3, 100076.
  year: '2021'
  abstract: The present research examines how perceptions of e-scooter mobile apps (i.e., a communication technology) influence intent to use e-scooters (i.e., a transportation technology) while considering other perceptions specific to e-scooters (ease of use, usefulness, safety, environmental impact, and enjoyment), context of use (geographic landscape), and demographic factors (age and sex). Results suggest mobile app perceived ease of use is associated with e-scooter use intent and this effect is mediated by e-scooter perceived usefulness, even when controlling for e-scooter perceived ease of use as well as other influential elements of e-scooter use. In addition to illustrating the importance of user experiences with mobile apps within the e-scooter context, this interdisciplinary research furthers a fundamental argument that media technologies are an integral factor in the adoption of transportation technologies.
  url: https://doi.org/10.1016/j.chbr.2021.100076
  themes:
  - Smartphone and Mobile Technologies
- title: The paradox of technology innovativeness and risk perceptions – A profile of Asian smartphone users
  meta: Wang, X. & Lee, K. M. (2020). Telematics and Informatics, 51, 101415.
  year: '2020'
  abstract: 'Risk perceptions and technology innovativeness are the two primary factors related to the adoption of mobile technologies. The current study examines the role of technology innovativeness and risk perceptions on smartphone use and dependence in an Asian context. A total of 9086 participants were recruited through online surveys from ten Asian countries. Ordinary least squares regression analyses revealed the effects of technology innovativeness, information security, privacy concern, and their interactions on smartphone use and dependence. Moreover, based on users'' smartphone usage patterns and perceptions, this paper identified four homogeneous groups using cluster analysis. Results shows that Asian smartphone users can be segmented into four groups: innovators, conservatives, moderators, and laggards. The four clusters show significant differences in demographic features. Theoretical and practical implications are discussed based on these findings.'
  url: https://doi.org/10.1016/j.tele.2020.101415
  themes:
  - Smartphone and Mobile Technologies
- title: Vehicle politeness in driving situations
  meta: Lee, J. G., Lee, K. M., & Ryu, S. H. (2019). Future Internet, 11(1), 1-10.
  year: '2019'
  abstract: This study presents linguistically augmented models of phrase-based statistical machine translation (PBSMT) using different linguistic features (factors) on the top of the source surface form. The architecture addresses two major problems occurring in machine translation, namely the poor performance of direct translation from a highly-inflected and morphologically complex language into morphologically poor languages, and the data sparseness issue, which becomes a significant challenge under low-resource conditions. We use three factors (lemma, part-of-speech tags, and morphological features) to enrich the input side with additional information to improve the quality of direct translation from Arabic to Chinese, considering the importance and global presence of this language pair as well as the limitation of work on machine translation between these two languages. In an effort to deal with the issue of the out of vocabulary (OOV) words and missing words, we propose the best combination
    of factors and models based on alternative paths. The proposed models were compared with the standard PBSMT model which represents the baseline of this work, and two enhanced approaches tokenized by a state-of-the-art external tool that has been proven to be useful for Arabic as a morphologically rich and complex language. The experiment was performed with a Moses decoder on freely available data extracted from a multilingual corpus from United Nation documents (MultiUN). Results of a preliminary evaluation in terms of BLEU scores show that the use of linguistic features on the Arabic side considerably outperforms baseline and tokenized approaches, the system can consistently reduce the OOV rate as well.
  url: https://doi.org/10.3390/fi11010022
  themes:
  - Speech User Interface
- title: Human-computer interaction
  meta: Jung, Y., & Lee, K. M. (2017). In P. Roessler, C. A. Hoffner, & L. van Zoonen (Eds.), The International Encyclopedia of Media Effects (pp. 721-730). Wiley-Blackwell.
  year: '2017'
  abstract: Human–computer interaction (HCI) is an interdisciplinary field that studies how people interact with machines in general and with computing systems in particular. Despite its initial development as a specialization in computer science, the field has quickly become multidisciplinary. It now sits at the crossroad between social sciences (on the human side) and computer science (on the technological side). It tries to answer daily questions that emerge from the rapidly increasing interaction between humans and computers. As implied by the two perspectives on the concept of interactivity and affordance (i.e., technological features vs. human perception), the various subdisciplines of HCI have developed and remained largely distinct. This presents both challenges and opportunities for HCI scholars. Embracing new paradigms such as the human factors approach, the field has demonstrated some potential for theoretical concepts to be successfully transformed into easy-to-use everyday products
    (e.g., speech interface, social robots, and/or smart devices).
  url: https://doi.org/10.1002/9781118783764.wbieme0140
  themes:
  - HCI Theories, Concepts and Philosophy
- title: Cognitive map or medium materiality? Reading on paper and screen
  meta: Hou, J., Rashid, J., & Lee, K. M. (2017). Computers in Human Behavior, 67, 84-94.
  year: '2017'
  abstract: 'The present study examined two common mechanisms that are used to explain why reading on an electronic screen versus paper result in different reading outcomes: The Cognitive Map Mechanism and the Medium Materiality Mechanism. A laboratory experiment (N = 45), was conducted using a three-group comparison design (paper book vs. digital equivalent vs. digital disrupted view). Our hypotheses that were based on the cognitive map mechanism were largely supported. On the other hand, our hypotheses following the medium materiality mechanism were not sufficiently evidenced. Specifically, our results showed that the paper book was similar to its digital equivalent, and both were better than the digital disrupted view in terms of reading comprehension, feelings of fatigue, and psychological immersion. The findings implied that it is not the materiality of the presentation medium that influences reading outcomes, rather it is the extent to which the text presentation facilitates, or impedes,
    the reader''s ability to construct a cognitive map that influences the reading process. Implications for future research and practice are discussed.'
  url: https://doi.org/10.1016/j.chb.2016.10.014
  themes:
